[package]
name = "mini_snmp"
version = "0.1.0"
edition = "2021"
description = "A minimal SNMP (Simple Network Management Protocol) implementation in Rust"
license = "MIT"
repository = "https://github.com/ArnaudVERSINI/mini_snmp"
keywords = ["snmp", "network", "management", "protocol"]
categories = ["network-programming"]
readme = "README.md"

[dependencies]
snmp2 = { version = "0.5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = 3
lto = true
